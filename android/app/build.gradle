plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// SDL2 source tree: see the root build.gradle.
def sdl2Dir = rootProject.ext.geSdl2Dir
// ROM regions in the APK: the app module builds libmain.so (US, always);
// android/region-pal and region-jpn add libmain_pal.so and libmain_jpn.so.
// -Pge.regions=ntsc-final for a quicker US-only build.
def geRegions = providers.gradleProperty('ge.regions')
        .getOrElse('ntsc-final,pal-final,jpn-final').split(',')*.trim().findAll { it }
if (!geRegions.contains('ntsc-final')) {
    geRegions = ['ntsc-final'] + geRegions
}

android {
    namespace 'io.github.zeptoniator.ge007'
    compileSdk 37
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'io.github.zeptoniator.ge007'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '0.6.0-android.1'

        externalNativeBuild {
            cmake {
                arguments "-DGE_SDL2_SOURCE_DIR=${sdl2Dir}",
                          '-DROMID=ntsc-final',
                          '-DANDROID_STL=c++_static'
                targets 'ge007', 'SDL2', 'geload'
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
        buildConfigField 'String', 'GE_REGIONS', "\"${geRegions.join(',')}\""
    }

    buildTypes {
        debug {
            // The game is unplayable at -O0 (software RSP); keep the native
            // side optimised in debug APKs too.
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo' } }
        }
        release {
            minifyEnabled false
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo' } }
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', "${sdl2Dir}/android-project/app/src/main/java"]
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.31.6'
        }
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
            // Each region module builds SDL2 too (a dependency of its libmain).
            pickFirsts += ['**/libSDL2.so']
        }
    }

    lint {
        abortOnError false
    }
}

// --------------------------------------------------------------------------
// First-run asset preparation (SetupActivity -> src/main/python/ge007_convert.py)
//
// The converters (tools_pc/d43_emit.py, d69_emit.py, d88_emit.py +
// d88_propdefs.py) are compiled into the APK unchanged. Besides the ROM they
// read a few committed repo files -- the ROM file lists, the file resource
// table and every model file header -- zipped here into an APK asset.
// Nothing ROM-derived goes into the APK.
def repoRoot = rootProject.file('..')

chaquopy {
    defaultConfig {
        version '3.13'
    }
    sourceSets {
        getByName('main') {
            srcDir("${repoRoot}/tools_pc")
            include 'ge007_convert.py', 'd43_emit.py', 'd69_emit.py', 'd88_emit.py', 'd88_propdefs.py'
        }
    }
}

def convertInputs = tasks.register('ge007ConvertInputs', Zip) {
    archiveFileName = 'ge007-convert-inputs.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/ge007/assets')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(repoRoot) {
        include 'scripts/filelist.*.csv'
        include 'assets/obseg/file_resource_table.inc.c'
    }
    from("${repoRoot}/assets") {
        into 'assets'
        include { e -> e.directory || e.name.toLowerCase().endsWith('modelfileheader.inc.c') }
        includeEmptyDirs = false
    }
}

// The licences screen (Licences.java): this project's LICENSE and NOTICE,
// then every third-party component in the APK, in one text asset. The
// texts that are not in the repo or the SDL2 tree are in android/licences/.
def licenceParts = [
    ['GoldenEye 007 PC port (this app) - MIT License', "${repoRoot}/LICENSE"],
    ['What the license covers (NOTICE)', "${repoRoot}/NOTICE"],
    ['fast3d (port/fast3d)', "${repoRoot}/port/fast3d/LICENSE.txt"],
    ['SDL2 - zlib License', "${sdl2Dir}/LICENSE.txt"],
    ['Python 3.13 (CPython) - PSF License', "${rootDir}/licences/python-LICENSE.txt"],
    ['Software incorporated in Python (OpenSSL, expat, libffi, zlib, libmpdec, ...)',
     "${rootDir}/licences/python-incorporated.rst"],
    ['Chaquopy (embedded Python) - MIT License', "${rootDir}/licences/chaquopy-LICENSE.txt"],
    ['Other libraries in the Python runtime', "${rootDir}/licences/runtime-libraries.txt"],
]
def licencesAsset = tasks.register('ge007Licences') {
    def out = layout.buildDirectory.file('generated/ge007/assets/licences.txt')
    inputs.files(licenceParts.collect { it[1] })
    outputs.file(out)
    doLast {
        def sb = new StringBuilder()
        licenceParts.each { part ->
            def rule = '=' * 72
            sb << rule << '\n' << part[0] << '\n' << rule << '\n\n'
            sb << new File(part[1]).getText('UTF-8').trim() << '\n\n\n'
        }
        out.get().asFile.text = sb.toString()
    }
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/ge007/assets').get().asFile)
tasks.named('preBuild') { dependsOn convertInputs, licencesAsset }

dependencies {
    if (geRegions.contains('pal-final')) {
        implementation project(':region-pal')
    }
    if (geRegions.contains('jpn-final')) {
        implementation project(':region-jpn')
    }
}
